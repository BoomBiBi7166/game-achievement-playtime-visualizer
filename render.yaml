services:
  - type: web
    name: playscape-game-visualizer
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: playscape-game-visualizer
          envVarKey: RENDER_EXTERNAL_URL
      - key: STEAM_API_KEY
        sync: false
